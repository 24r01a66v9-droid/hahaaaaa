
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy Mindset - Student Wellness Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            scroll-behavior: smooth;
            background-color: #020617; /* Slate 950 */
        }
        .glass {
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.1);
        }
        .aurora-bg {
            background: 
                radial-gradient(circle at 0% 0%, hsla(30, 100%, 7%, 1) 0, transparent 50%), 
                radial-gradient(circle at 50% 0%, hsla(45, 100%, 5%, 1) 0, transparent 50%), 
                radial-gradient(circle at 100% 0%, hsla(20, 100%, 6%, 1) 0, transparent 50%);
            background-attachment: fixed;
        }
        .constellation-pattern {
            background-image: radial-gradient(rgba(249, 115, 22, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
